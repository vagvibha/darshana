site_name: "वेदान्तर्शनम्"
google_analytics_property: "G-86P5515DPZ"

theme:
  primary: "deep orange"
  accent: "amber"
  language: "sa"

labels:
  home_title: "विमर्शसामग्रीसङ्ग्रहः"
  home_nav_label: "मुखपृष्ठम्"        # nav root entry (mkdocs.yml nav's first item)
  home_button_label: "मुखपृष्ठम्"     # the Home button in every page's own top navbar
  intro_nav_label: "परिचयः"           # per-text "introduction" TOC nav label
  author_label: "कर्ता:"              # prefix before a text's author on its TOC page

  # topic pages
  shloka_list_heading: "श्लोकसूची"
  definitions_heading: "परिभाषाः"
  term_column_heading: "संज्ञा"
  definition_column_heading: "परिभाषा"
  source_column_heading: "मूलम्"
  references_heading: "प्रसङ्गाः"

# override per-text
default_chapter_word: "अध्यायः"

maintain_shloka_linebreak: true

topics:
  dir: "topics"
  h1_label: "विषयाः (रच्यमानाः ...)"

dictionaries:
  - name: Advaita
    folder: advaita
  - name: Darshana
    folder: darshana


content_root: "contents"
content_sections:
  # --- Card 1: Advaita
  - dir: "advaita"
    h1_label: "अद्वैतवेदान्तः"
    default_chapter_word: "अध्यायः"
    text_groups:
      - dir: "pravesha"
        h2_label: "प्राथमिकप्रकरणग्रन्थाः"
      - dir: "praudha"
        h2_label: "प्रौढप्रकरणग्रन्थाः"
      - dir: "stotra"
        h2_label: "स्तोत्राणि"
      - dir: "prasthanatraya"
        h2_label: "प्रस्थानत्रयी"
      - dir: "siddhigrantha"
        h2_label: "सिद्धिग्रन्थाः"

  # --- Card 2: other shastras
  - dir: "itarashastra"
    h1_label: "इतरशास्त्राणि"
    default_chapter_word: "अध्यायः"
    text_groups:
      - dir: "tarka"
        h2_label: "तर्कशास्त्रम्"
