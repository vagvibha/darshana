title: "सर्ववेदान्तसिद्धान्तसारसङ्ग्रहः"
shloka_toc: false
chapters: "विषयाः"
header: |
        **अखण्डानन्दसम्बोधो वन्दनाद्यस्य जायते ।<br>
        गोविन्दं तमहं वन्दे चिदानन्दतनुं गुरुम् ॥१॥<br>
        अखण्डं सच्चिदानन्दमवाङ्मनसगोचरम् ।<br>
        आत्मानमखिलाधारमाश्रयेऽभीष्टसिद्धये ॥२॥<br>
        यदालम्बो दरं हन्ति सतां प्रत्यूहसम्भवम् ।<br>
        तदालम्बे दयालम्बं लम्बोदरपदाम्बुजम् ॥३॥<br>
        अर्थतोऽप्यद्वयानन्दमतीतद्वैतलक्षणम् ।<br>
        आत्माराममहं वन्दे श्रीगुरुं शिवविग्रहम् ॥<br>
        वेदान्तशास्त्रसिद्धान्तसारसङ्ग्रह उच्यते ।<br>
        प्रेक्षावतां मुमुक्षूणां सुखबोधोपपत्तये ॥४॥**
   
