header: |
        **अखण्डं सच्चिदानन्दमवाङ्मनसगोचरम् ।<br>
        आत्मानमखिलाधारमाश्रयेऽभीष्टसिद्धये ॥१॥<br>
        अर्थतोऽप्यद्वयानन्दानतीतद्वैतभानतः ।<br>
        गुरूनाराध्य वेदान्तसारं वक्ष्ये यथामति ॥२॥**<br>

